publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # PocketBase
  pocketbase: ^0.21.0

  # State Management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^7.2.2
  image_picker: ^1.1.1
  file_picker: ^8.0.0+1
  uuid: ^4.4.0
  http: ^1.2.0
  path: ^1.9.0

  # UI
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
